
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Teja App Store | Discover Android Apps</title>

  <meta name="description"
        content="Discover and download Android apps from Teja App Store. No sign-in required.">

  <!-- Browser tab icon: use confirmed working image -->
  <link rel="icon" type="image/png" href="/teja-favicon.png">
  <link rel="shortcut icon" type="image/png" href="/teja-favicon.png">
  <link rel="apple-touch-icon" href="/teja-favicon.png">

  <!-- Existing website CSS -->
  <link rel="stylesheet" href="/style.css">


</head>

<body>

  <!-- Website header -->
  <header>
    <a class="brand" href="/">

      <!-- Use the image that works on Cloudflare -->
      <img
        src="/teja-logo.png"
        alt=""
        class="brand-logo"
        width="76"
        height="58"
      >

      <span class="brand-name">
        Teja App Store
      </span>

    </a>

    <span class="muted">
      Android Apps • No Sign-in Required
    </span>
  </header>

  <!-- Main content -->
  <main class="wrap">

    <!-- Homepage banner -->
    <section class="hero">
      <div class="eyebrow">✦ Discover • Download • Explore</div>

      <img
        src="/teja-logo.png"
        alt="Teja App Store Banner"
        class="store-banner"
      >

      <h1>Your next favorite app starts here.</h1>

      <p>
        Explore, download and install useful Android
        applications. No account required.
      </p>

    </section>

    <!-- Search and filter -->
    <h2 class="section-heading">Explore our apps</h2>
    <div class="toolbar">

      <input
        id="search"
        type="search"
        placeholder="Search apps..."
        aria-label="Search apps"
      >

      <select
        id="category"
        aria-label="Filter by category"
      >
        <option value="">
          All categories
        </option>
      </select>

    </div>

    <!-- Existing dynamic app listings -->
    <div id="apps" class="grid">
      <p>Loading apps...</p>
    </div>

  </main>

  <!-- Footer -->
  <footer>
    © 2026 Teja App Store.
    Download APKs responsibly.
  </footer>

  <!-- Keep these existing files connected -->
  <script src="/config.js"></script>
  <script type="module" src="/public.js"></script>

</body>
</html>
