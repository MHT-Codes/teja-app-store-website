
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Teja App Store — Android Apps</title>

  <meta name="description"
        content="Discover and download Android apps from Teja App Store. No login required.">

  <!-- Browser tab icon -->
  <link rel="icon" type="image/png" href="/teja-favicon.png">

  <!-- Existing stylesheet -->
  <link rel="stylesheet" href="/style.css">

  <style>
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .brand-logo {
      width: 56px;
      height: 56px;
      object-fit: contain;
      border-radius: 12px;
      flex-shrink: 0;
    }

    .brand-name {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .store-banner {
      display: block;
      width: 100%;
      max-width: 680px;
      height: auto;
      margin: 0 auto 24px;
      border-radius: 18px;
    }

    @media (max-width: 600px) {
      .brand-logo {
        width: 42px;
        height: 42px;
      }

      .brand-name {
        font-size: 17px;
      }

      header .muted {
        font-size: 11px;
      }
    }
  </style>
</head>

<body>

  <!-- Website header -->
  <header>
    <a class="brand" href="/">
      <img
        src="/teja-favicon.png"
        alt="Teja App Store icon"
        class="brand-logo"
      >
      <span class="brand-name">Teja App Store</span>
    </a>

    <span class="muted">
      Android apps • No sign-in
    </span>
  </header>

  <!-- Main website content -->
  <main class="wrap">

    <!-- Banner -->
    <section class="hero">
      <img
        src="/teja-logo.png"
        alt="Teja App Store — Discover, Download, Grow"
        class="store-banner"
      >

      <h1>Discover great Android apps</h1>

      <p>
        Browse, explore and install APKs directly.
        No account required.
      </p>
    </section>

    <!-- Search and category filters -->
    <div class="toolbar">
      <input
        id="search"
        type="search"
        placeholder="Search apps..."
        aria-label="Search apps"
      >

      <select
        id="category"
        aria-label="Filter by category"
      >
        <option value="">All categories</option>
      </select>
    </div>

    <!-- Dynamic app listings -->
    <div id="apps" class="grid">
      <p>Loading apps...</p>
    </div>

  </main>

  <!-- Footer -->
  <footer>
    Teja App Store · Download APKs responsibly
  </footer>

  <!-- Firebase and backend configuration -->
  <script src="/config.js"></script>

  <!-- App listings, search and downloads -->
  <script type="module" src="/public.js"></script>

</body>
</html>
