
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Teja App Store | Discover Android Apps</title>

  <meta name="description"
        content="Discover and download Android apps from Teja App Store. No sign-in required.">

  <!-- Browser tab icon: use confirmed working image -->
  <link rel="icon" type="image/png" href="/teja-logo.png?v=7">
  <link rel="shortcut icon" type="image/png" href="/teja-logo.png?v=7">
  <link rel="apple-touch-icon" href="/teja-logo.png?v=7">

  <!-- Existing website CSS -->
  <link rel="stylesheet" href="/style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f9ff;
      color: #172554;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding: 16px 5%;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      min-width: 0;
    }

    .brand-logo {
      width: 76px;
      height: 58px;
      object-fit: contain;
      border-radius: 10px;
      flex-shrink: 0;
    }

    .brand-name {
      font-size: 24px;
      font-weight: 800;
      color: #1746a2;
      letter-spacing: -0.5px;
    }

    header .muted {
      font-size: 13px;
      color: #64748b;
    }

    main.wrap {
      width: min(1100px, 94%);
      margin: 0 auto;
      padding: 30px 0;
    }

    .hero {
      background: linear-gradient(
        120deg,
        #1254cb,
        #5634d9
      );
      color: white;
      border-radius: 24px;
      padding: 30px 24px;
      text-align: center;
      margin-bottom: 26px;
      overflow: hidden;
    }

    .store-banner {
      display: block;
      width: 100%;
      max-width: 550px;
      height: auto;
      margin: 0 auto 24px;
      border-radius: 18px;
      background: white;
    }

    .hero h1 {
      font-size: clamp(26px, 4vw, 40px);
      margin: 12px 0;
      color: white;
    }

    .hero p {
      font-size: 16px;
      line-height: 1.6;
      color: #eef2ff;
      margin: 0;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 25px;
    }

    .toolbar input,
    .toolbar select {
      padding: 14px;
      border: 1px solid #dce3ef;
      border-radius: 12px;
      background: white;
      font-size: 15px;
      color: #172554;
    }

    .toolbar input {
      flex: 1;
      min-width: 200px;
    }

    .toolbar select {
      min-width: 160px;
    }

    .grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }

    footer {
      text-align: center;
      padding: 28px 16px;
      font-size: 13px;
      color: #64748b;
    }

    @media (max-width: 600px) {
      header {
        padding: 12px 16px;
      }

      .brand {
        gap: 8px;
      }

      .brand-logo {
        width: 48px;
        height: 44px;
      }

      .brand-name {
        font-size: 18px;
      }

      header .muted {
        display: none;
      }

      main.wrap {
        width: 94%;
        padding-top: 20px;
      }

      .hero {
        padding: 20px 14px;
      }

      .toolbar {
        flex-direction: column;
      }

      .toolbar input,
      .toolbar select {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <!-- Website header -->
  <header>
    <a class="brand" href="/">

      <!-- Use the image that works on Cloudflare -->
      <img
        src="/teja-logo.png?v=7"
        alt=""
        class="brand-logo"
        width="76"
        height="58"
      >

      <span class="brand-name">
        Teja App Store
      </span>

    </a>

    <span class="muted">
      Android Apps • No Sign-in Required
    </span>
  </header>

  <!-- Main content -->
  <main class="wrap">

    <!-- Homepage banner -->
    <section class="hero">

      <img
        src="/teja-logo.png?v=7"
        alt="Teja App Store Banner"
        class="store-banner"
      >

      <h1>Discover Great Android Apps</h1>

      <p>
        Explore, download and install useful Android
        applications. No account required.
      </p>

    </section>

    <!-- Search and filter -->
    <div class="toolbar">

      <input
        id="search"
        type="search"
        placeholder="Search apps..."
        aria-label="Search apps"
      >

      <select
        id="category"
        aria-label="Filter by category"
      >
        <option value="">
          All categories
        </option>
      </select>

    </div>

    <!-- Existing dynamic app listings -->
    <div id="apps" class="grid">
      <p>Loading apps...</p>
    </div>

  </main>

  <!-- Footer -->
  <footer>
    © 2026 Teja App Store.
    Download APKs responsibly.
  </footer>

  <!-- Keep these existing files connected -->
  <script src="/config.js"></script>
  <script type="module" src="/public.js"></script>

</body>
</html>
