<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Teja App Store</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="brand" href="/">✦ Teja App Store</a><a href="/">Public store</a></header><main class="wrap"><section class="panel"><h1>Administrator</h1><p class="muted">Only the account you create in Firebase can publish apps.</p><div id="login"><form id="loginForm"><label>Email</label><input id="email" type="email" required autocomplete="username"><label>Password</label><input id="password" type="password" required autocomplete="current-password"><button>Sign in</button></form></div><div id="dashboard" hidden><p>Signed in as <strong id="who"></strong> <button id="logout" class="secondary" type="button">Sign out</button></p><h2>Publish Android app</h2><form id="uploadForm"><label>App name</label><input name="name" required maxlength="100"><label>Description</label><textarea name="description" rows="5" maxlength="5000" required></textarea><label>Category</label><select name="category"><option>Business</option><option>Education</option><option>Productivity</option><option>Tools</option><option>Entertainment</option><option>Other</option></select><label>Version</label><input name="version" placeholder="1.0.0" required><label>App logo (PNG/JPG/WebP)</label><input name="logo" type="file" accept="image/png,image/jpeg,image/webp" required><label>Screenshots (up to 8)</label><input name="screenshots" type="file" accept="image/png,image/jpeg,image/webp" multiple><label>Signed APK file (up to 90 MiB)</label><input name="apk" type="file" accept=".apk,application/vnd.android.package-archive" required><button id="publish">Upload & Publish</button></form><h2>Your published apps</h2><div id="myApps">Loading...</div></div><div id="status" class="message" role="status" aria-live="polite">Ready.</div></section></main><script src="/config.js"></script><script type="module" src="/admin.js"></script></body></html>
